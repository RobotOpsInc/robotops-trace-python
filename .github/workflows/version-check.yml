name: Version Check

on:
  pull_request:
    branches: [development, main]

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging
        run: python -m pip install --quiet packaging

      - name: Extract version from pyproject.toml
        id: pyproject_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.pyproject_version.outputs.version }}"

          # Accept release (X.Y.Z) and PEP 440 pre-releases (X.Y.ZrcN / X.Y.Z.devN).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((rc|a|b)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid release or PEP 440 pre-release (X.Y.Z / X.Y.ZrcN / X.Y.Z.devN)"
            exit 1
          fi

          # Floor: >= 0.1.0
          BASE="${VERSION%%rc*}"; BASE="${BASE%%a*}"; BASE="${BASE%%b*}"; BASE="${BASE%%.dev*}"
          IFS='.' read -r major minor patch <<< "$BASE"
          if [[ "$major" -eq 0 && "$minor" -eq 0 ]]; then
            echo "::error::Version must be >= 0.1.0, got $VERSION"
            exit 1
          fi

          echo "Version $VERSION is valid"

      - name: Check CHANGELOG.md for version entry
        run: |
          VERSION="${{ steps.pyproject_version.outputs.version }}"

          # Format: "## [X.Y.Z] - YYYY-MM-DD" at the start of a line (Keep a Changelog).
          if ! grep -qE "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version ${VERSION}"
            echo "Expected format: '## [${VERSION}] - YYYY-MM-DD'"
            exit 1
          fi

          echo "CHANGELOG.md has entry for version ${VERSION}"

      - name: Check version against PyPI
        env:
          NEW_VERSION: ${{ steps.pyproject_version.outputs.version }}
        run: |
          # Query PyPI's JSON API for the published releases of robotops-trace.
          # A 404 means the package has never been published — first publish allowed.
          HTTP_CODE=$(curl -fsS -o pypi.json -w "%{http_code}" \
            "https://pypi.org/pypi/robotops-trace/json" || echo "000")

          if [[ "$HTTP_CODE" == "404" ]]; then
            echo "robotops-trace not yet published on PyPI (404). First publish allowed."
            exit 0
          fi

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Unexpected response from PyPI (HTTP $HTTP_CODE). Skipping published-version comparison."
            exit 0
          fi

          # Compare against the highest published version using PEP 440 ordering.
          python .github/scripts/check_pypi_version.py "$NEW_VERSION" pypi.json
