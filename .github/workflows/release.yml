name: Release

on:
  workflow_dispatch:
    # Manual trigger only — production PyPI releases from main branch only.
    inputs:
      dry_run:
        description: 'Dry run (build + validate, do not publish)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure release is from main branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production releases can only be created from main branch"
            echo "Current branch: ${{ github.ref }}"
            echo "For pre-releases, use the Release Development workflow (TestPyPI)"
            exit 1
          fi
          echo "Production PyPI release from main branch"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Reject pre-release versions on main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" =~ (rc|a|b|\.dev) ]]; then
            echo "::error::'$VERSION' is a pre-release; publish those to TestPyPI via release-dev"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: write  # Needed to create the GitHub release + tag
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token: identity is verified via OIDC against the PyPI
        # Trusted Publisher registered for RobotOpsInc/robotops-trace-python.

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            --title "Release ${{ needs.build.outputs.tag }}" \
            --notes "Published \`robotops-trace\` ${{ needs.build.outputs.version }} to PyPI. See CHANGELOG.md." \
            dist/*

  dry-run-summary:
    needs: build
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Dry Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Would publish robotops-trace ${{ needs.build.outputs.version }} to PyPI." >> "$GITHUB_STEP_SUMMARY"
