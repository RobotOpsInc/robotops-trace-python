name: Release Development

on:
  workflow_dispatch:
    # Manual trigger only — pre-releases from development branch to TestPyPI.
    inputs:
      dry_run:
        description: 'Dry run (build + validate, do not publish)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure release is from development branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/development" ]]; then
            echo "::error::Development pre-releases can only be published from the development branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "Pre-release from development branch to TestPyPI"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Require a PEP 440 pre-release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # TestPyPI lane carries pre-releases only: X.Y.ZrcN / X.Y.Z.devN (also aN/bN).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((rc|a|b)[0-9]+|\.dev[0-9]+)$ ]]; then
            echo "::error::TestPyPI lane requires a pre-release version (X.Y.ZrcN / X.Y.Z.devN), got '$VERSION'"
            echo "Bump pyproject.toml to a pre-release before running this workflow."
            exit 1
          fi
          echo "Pre-release version $VERSION accepted"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Required for TestPyPI Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        # No API token: identity is verified via OIDC against the TestPyPI
        # Trusted Publisher registered for RobotOpsInc/robotops-trace-python.

  dry-run-summary:
    needs: build
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Dry Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Would publish robotops-trace ${{ needs.build.outputs.version }} to TestPyPI." >> "$GITHUB_STEP_SUMMARY"
