[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotops-trace"
version = "0.1.0"
description = "RobotOps distributed-tracing SDK core for Python — the SDK half of the SDK + carrier model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Robot Ops Inc.", email = "support@robotops.com" }]
keywords = ["tracing", "observability", "opentelemetry", "robotics", "ros2", "distributed-tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # The core is OpenTelemetry-compatible: spans are exported over OTLP to the
    # local carrier (robot_agent / collector). These are real deps so the OTLP
    # lane is wired, but the module stays importable as a stub (see ROB-420).
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/RobotOpsInc/robotops-trace-python"
Repository = "https://github.com/RobotOpsInc/robotops-trace-python"
Changelog = "https://github.com/RobotOpsInc/robotops-trace-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/robotops"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/robotops"]
