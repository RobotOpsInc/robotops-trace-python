[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotops-trace"
version = "0.1.0"
description = "RobotOps distributed-tracing SDK core for Python — the SDK half of the SDK + carrier model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Robot Ops Inc.", email = "support@robotops.com" }]
keywords = ["tracing", "observability", "opentelemetry", "robotics", "ros2", "distributed-tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # The core builds on the opentelemetry-sdk; our public API is a thin
    # ergonomic layer over it. Spans are exported over OTLP/HTTP (protobuf) to
    # the local carrier (robot_agent / collector). We depend on the
    # proto-http exporter specifically (NOT the generic otlp meta-package) to
    # keep the footprint light and avoid pulling in gRPC (see ROB-420).
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/RobotOpsInc/robotops-trace-python"
Repository = "https://github.com/RobotOpsInc/robotops-trace-python"
Changelog = "https://github.com/RobotOpsInc/robotops-trace-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/robotops"]

# Ship the auto-init startup hook (ROB-421) at the site-packages root so the
# interpreter's `site` module executes its `import` line at startup. force-include
# maps the repo-root .pth to the wheel root (purelib), which installs into
# site-packages/ alongside the `robotops` package.
[tool.hatch.build.targets.wheel.force-include]
"robotops_autoinit.pth" = "robotops_autoinit.pth"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/robotops"]

# OpenTelemetry's exporter/proto packages don't all ship inline types; don't
# fail strict type-checking of our own code on third-party import resolution.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# The UDS transport (ROB-441) subclasses requests/urllib3 connection internals.
# These ship no usable stubs for the private classes we extend; skip them so
# strict checking of our own code isn't gated on third-party type resolution.
[[tool.mypy.overrides]]
module = ["requests.*", "urllib3.*"]
ignore_missing_imports = true
follow_imports = "skip"
